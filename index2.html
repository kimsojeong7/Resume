<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAND ROYAL RESIDENCE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    color: white;
    overflow-x: hidden;
}

/* ================= HERO ================= */

.hero {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
                url('https://images.unsplash.com/photo-1505691723518-36a3f673f9d3') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero h1 {
    font-size: 70px;
    letter-spacing: 5px;
    background: linear-gradient(to right, gold, white);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glow 3s infinite alternate;
}

.hero p {
    margin-top: 20px;
    font-size: 22px;
    color: #ccc;
}

@keyframes glow {
    from { text-shadow: 0 0 10px gold; }
    to { text-shadow: 0 0 30px goldenrod; }
}

/* ================= BUILDING INFO ================= */

.section {
    padding: 100px 10%;
}

.section h2 {
    text-align: center;
    font-size: 40px;
    margin-bottom: 60px;
    color: gold;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
}

.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,215,0,0.3);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    transition: 0.4s;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(255,215,0,0.3);
}

.card h3 {
    margin-bottom: 20px;
    color: gold;
}

/* ================= FLOOR PLAN ================= */

.floor-plan {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 200px);
    gap: 10px;
    margin-top: 50px;
}

.room {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border-radius: 15px;
    transition: 0.3s;
    cursor: pointer;
}

/* Individual Rooms */
.living { grid-column: span 2; background: #3a3a3a; }
.kitchen { background: #2a2a2a; }
.dining { background: #333; }
.bedroom1 { grid-column: span 2; background: #444; }
.bedroom2 { background: #383838; }
.bathroom { background: #2f2f2f; }
.office { grid-column: span 4; background: #1f1f1f; }

.room:hover {
    background: gold;
    color: black;
    transform: scale(1.05);
}

/* ================= FOOTER ================= */

footer {
    text-align: center;
    padding: 40px;
    background: #000;
    color: #888;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 768px) {
    .hero h1 {
        font-size: 40px;
    }

    .floor-plan {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
    }

    .office {
        grid-column: span 2;
    }
}
</style>
</head>
<body>

<section class="hero">
    <div>
        <h1>GRAND ROYAL RESIDENCE</h1>
        <p>압도적인 품격과 웅장함의 결정체</p>
    </div>
</section>

<section class="section">
    <h2>건물 특징</h2>
    <div class="cards">
        <div class="card">
            <h3>🏛 구조</h3>
            <p>최첨단 설계와 고급 대리석 마감. 내진 설계 완비.</p>
        </div>
        <div class="card">
            <h3>🔐 보안 시스템</h3>
            <p>AI 기반 출입 통제 및 24시간 스마트 감시 시스템.</p>
        </div>
        <div class="card">
            <h3>🌿 친환경</h3>
            <p>태양광 에너지와 자동 환기 시스템 적용.</p>
        </div>
    </div>
</section>

<section class="section">
    <h2>집안 배치도</h2>

    <div class="floor-plan">
        <div class="room living">거실</div>
        <div class="room kitchen">주방</div>
        <div class="room dining">다이닝</div>
        <div class="room bedroom1">마스터 침실</div>
        <div class="room bedroom2">게스트 룸</div>
        <div class="room bathroom">욕실</div>
        <div class="room office">프라이빗 오피스</div>
    </div>
</section>

<footer>
    © 2026 GRAND ROYAL RESIDENCE | All Rights Reserved
</footer>

</body>
</html>
